name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Instalamos Gradle 9.2.1 de forma global en la máquina de GitHub
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.2.1'

      # Como no tienes el wrapper en tu repositorio, lo creamos desde cero aquí mismo
      - name: Generate Missing Gradle Wrapper
        run: gradle wrapper --gradle-version 9.2.1

      # Ahora que el archivo ya existe en el servidor, le damos los permisos necesarios
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Compilamos usando el ejecutable recién creado
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouPlayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
