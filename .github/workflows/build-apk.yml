name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      # Se genera el wrapper primero si no está en el repositorio, pero es vital darle permisos después
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouPlayer-debug-apk
          # Usamos un comodín (*) para que la acción encuentre el archivo sin importar si renombraste el APK base en tu build.gradle
          path: app/build/outputs/apk/debug/*.apk
